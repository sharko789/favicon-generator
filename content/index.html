<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Material Symbol Favicon Generator</title>

  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/monolith.min.css">

  <script src="https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <div class="panel controls">
      <h2>Favicon Generator</h2>

      <label style="display:flex; flex-direction:column; gap:6px;">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <a href="https://fonts.google.com/icons" target="_blank">Icon Name</a>
          <span>toggle rounded</span>
        </div>

        <div style="display:flex; gap:10px; align-items:center;">
          <input id="iconName" value="home" autocomplete="off" style="flex:1;" />
          <input type="checkbox" id="iconStyleToggle" />
        </div>
      </label>

      <div class="color-row">
        <label>
          Background Color
          <button id="bgColorButton"></button>
        </label>

        <label>
          Icon Color
          <button id="iconColorButton"></button>
        </label>
      </div>

      <label>
        Corner Radius
        <input type="range" id="radius" min="0" max="256" step="2" value="200" />
      </label>

      <label>
        Icon Scale
        <input type="range" id="iconScale" min="0.6" max="1.6" step="0.02" value="1" />
      </label>
    </div>

    <div class="panel preview">
      <canvas id="canvas" width="512" height="512"></canvas>

      <div class="downloads">
        <button id="downloadICO">Download .ico</button>
        <button id="downloadZIP">Download PNG ZIP</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
